<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSCDA Voucher Desk</title>
<style>
:root{--navy:#183763;--deep:#12315B;--blue:#1558C0;--mid:#3D73D9;--pale:#EAF3FF;--soft:#DDEBFC;--surf:#F6F9FE;--bd:#D6E3F5;--mut:#58749B;--tx:#203A60;--ok:#1B7A46;--warn:#8A5A00;--err:#B3261E;--ff:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif}
*{box-sizing:border-box;margin:0}
body{font:16px/1.5 var(--ff);color:var(--tx);background:linear-gradient(#DDEBFC,#F3F8FF 360px) fixed;padding:12px}
.wrap{max-width:860px;margin:0 auto}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;color:var(--deep);font-weight:700}
.bar{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--bd);border-radius:18px;padding:10px 14px;box-shadow:0 4px 18px rgba(24,55,99,.06)}
.logo{width:40px;height:40px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;font:700 16px Georgia,serif}
.bar b{display:block;font:700 18px Georgia,serif;color:var(--deep)}.bar small,.mut{color:var(--mut);font-size:13px}
.me{margin-left:auto;text-align:right;font-size:13px}
.tabs{display:flex;gap:8px;margin:16px 0}
.tabs button{flex:1;padding:12px;border:1px solid var(--bd);background:#fff;border-radius:14px;font:600 15px/1.2 var(--ff);color:var(--mut);cursor:pointer}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.card{background:#fff;border:1px solid var(--bd);border-radius:20px;padding:18px;margin-bottom:14px}
.card h2{font-size:21px;margin-bottom:12px}
.f{margin-bottom:16px}.f>label,.lb{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.lock{font-size:13px;color:var(--mut);margin-top:4px}select:disabled{opacity:1;color:var(--tx);-webkit-text-fill-color:var(--tx);background:var(--soft)}
.btn.sec,.files button,.row{min-height:44px}.me a{color:var(--blue);font-weight:600;display:inline-flex;align-items:center;min-height:44px;padding:0 4px}
.req::after{content:" *";color:var(--err)}
input,select,textarea{width:100%;padding:13px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--surf);font:16px/1.4 var(--ff);color:var(--tx)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--mid);outline-offset:1px}
textarea{min-height:90px;resize:vertical}
.chk{display:flex;flex-wrap:wrap;gap:8px}.chk label,.rad label{display:flex;align-items:center;gap:8px;padding:11px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--surf);font-weight:500;cursor:pointer;min-height:44px}
.chk input,.rad input{width:18px;height:18px;padding:0}
.rad{display:grid;gap:8px;margin-bottom:8px}
.btn{width:100%;padding:15px;border:0;border-radius:14px;background:var(--blue);color:#fff;font:700 17px/1.2 var(--ff);cursor:pointer}
.btn.sec{background:var(--pale);color:var(--blue);border:1px solid var(--bd);width:auto;padding:11px 16px;font-size:15px}
.btn.bad{background:#fff;color:var(--err);border:1px solid var(--err)}.btn[disabled]{opacity:.55;cursor:wait}
.box{background:var(--pale);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;font-size:14px;margin-top:8px}
.note{background:var(--pale);border-left:4px solid var(--blue);border-radius:12px;padding:12px 14px;font-size:14px;margin-top:14px}
.msg{padding:12px 14px;border-radius:12px;margin-bottom:12px;font-size:15px}.msg.e{background:#FDECEA;color:var(--err)}.msg.s{background:#E6F4EC;color:var(--ok)}.msg.w{background:#FFF4DC;color:var(--warn)}
.fl{background:#FFF4DC;color:var(--warn);border-radius:10px;padding:6px 10px;font-size:13px;margin-top:6px}
.files div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--bd);border-radius:10px;margin-top:6px;font-size:14px}
.files button{border:0;background:none;color:var(--err);font-weight:700;cursor:pointer;padding:6px 10px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--bd);cursor:pointer}
.row:first-child{border-top:0}.row b{display:block}.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--navy);white-space:nowrap}
.pill.APPROVED,.pill.COMPLETED,.pill.VERIFIED{background:#E6F4EC;color:var(--ok)}.pill.REJECTED{background:#FDECEA;color:var(--err)}.pill.RETURNED{background:#FFF4DC;color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.chips span{background:var(--surf);border:1px solid var(--bd);border-radius:12px;padding:6px 12px;font-size:13px}
.sg{position:absolute;left:0;right:0;top:100%;z-index:5;margin-top:4px;background:#fff;border:1px solid var(--bd);border-radius:12px;box-shadow:0 8px 24px rgba(24,55,99,.14);max-height:260px;overflow:auto}.sg div{padding:11px 14px;cursor:pointer;font-size:15px;border-top:1px solid var(--bd)}.sg div:first-child{border-top:0}.sg div:hover{background:var(--pale)}
.fb{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.fb label{font-size:12px;color:var(--mut);font-weight:600;display:block;margin-bottom:3px}.fb select,.fb input{padding:11px 12px;font-size:16px}
.flt{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:8px}
dl{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;font-size:14px}dt{color:var(--mut)}dd{margin:0;overflow-wrap:anywhere}
.acts{display:grid;gap:8px;margin-top:12px}
.hide{display:none!important}
@media(min-width:640px){.fb{grid-template-columns:repeat(5,1fr)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.flt{grid-template-columns:200px 1fr}.acts{grid-template-columns:2fr 1fr 1fr}}
</style></head><body><div class="wrap">
<div class="bar"><div class="logo">DC</div><div><b>DSCDA</b><small>Voucher desk</small></div><div class="me" id="me"></div></div>
<form id="login" class="card hide"><h2>Sign in</h2><div class="f"><label for="lname">Your name</label><select id="lname"></select></div>
<div class="f"><label for="lpin">Personal PIN</label><input id="lpin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="10"></div>
<button class="btn" id="lgo">Sign in</button><p class="mut" id="ln" role="alert" style="margin-top:10px"></p></form>
<div id="err" class="card hide"></div>
<div id="app" class="hide">
<div class="tabs"><button data-t="new" id="tNew" class="on">New voucher</button><button data-t="mine">Vouchers</button><button data-t="rev" id="tRev" class="hide">Review</button></div>

<section id="new"><form class="card" id="f" novalidate>
<h2>New voucher</h2><div id="fm"></div>
<div class="g2"><div class="f"><label class="req" for="person">Person raising voucher</label><select id="person"></select></div>
<div class="f"><label class="req" for="dept">Department</label><select id="dept"></select></div>
<div class="f"><label class="req" for="date">Voucher date</label><input type="date" id="date"></div>
<div class="f"><label class="req" for="nature">Nature of voucher</label><select id="nature"></select></div></div>
<div id="modesBox" class="f hide"><span class="lb req">Type of conveyance</span><div class="chk" id="modes"></div></div>
<div id="route" class="hide">
<div class="f"><span class="lb">Starting point (always the office)</span><div class="box" id="startTxt" style="margin-top:0"></div></div>
<div class="f"><span class="lb">Destination</span><div class="rad">
<label><input type="radio" name="dm" value="gps"> Current location (I have reached it)</label>
<label><input type="radio" name="dm" value="manual" checked> Enter manually</label></div>
<div style="position:relative"><input id="dest" placeholder="Start typing a place or address" maxlength="200" aria-label="Destination" autocomplete="off"><div class="sg hide" id="sg" role="listbox"></div></div><div class="mut hide" id="gpsn"></div></div>
<div class="f"><label for="trip">Trip</label><select id="trip"><option value="1">One way</option><option value="2">Round trip (there and back)</option></select></div>
<div class="hide" id="mkm"><label for="manualKm">One-way distance in km (manual; flagged for review)</label><input type="number" id="manualKm" min="0" step="0.1" inputmode="decimal"></div>
<div class="box hide" id="chg" aria-live="polite"></div>
</div>
<div class="f"><label for="file">Bills / receipts (PDF, JPG, PNG — up to 10 MB total)</label>
<input type="file" id="file" accept="application/pdf,image/jpeg,image/png" multiple><div class="files" id="fl"></div>
<div class="mut hide" id="billn" style="margin-top:6px">A bill is required for Metro or Cab.</div></div>
<div class="box hide" id="ocr" aria-live="polite" style="margin:-4px 0 16px"></div>
<div class="f hide" id="rs"><label class="req" for="reason">Reason for missing receipt</label><input id="reason" maxlength="500"></div>
<div class="g2"><div class="f"><label class="req" for="amount">Amount claimed (₹)</label><input type="number" id="amount" min="0" step="0.01" inputmode="decimal"></div></div>
<div class="f"><label for="remarks">Remarks / purpose</label><textarea id="remarks" maxlength="1000" placeholder="Where, why, and what the amount covers"></textarea></div>
<button class="btn" id="go">Submit voucher</button>
<div class="note">Vouchers filled before 2 PM on Saturday are processed and paid on Tuesday, subject to verification and approval.</div>
</form></section>

<section id="mine" class="hide"><div class="card"><h2 id="mineH">Vouchers</h2><div class="fb" id="fb_mine"></div><div id="mineL"></div></div></section>
<section id="rev" class="hide"><div class="card"><h2>Review</h2><div class="chips" id="sum"></div><div class="fb" id="fb_rev"></div><div id="revL"></div></div></section>

<div class="card hide" id="det"></div>
</div>
</div>
<script>
const API_URL='PASTE_APPS_SCRIPT_EXEC_URL',MAPS_KEY='';   // not secrets. MAPS_KEY (optional) turns on Google Places suggestions
let sess='';try{sess=sessionStorage.getItem('dscda_s')||''}catch(e){}
const setSess=t=>{sess=t;try{t?sessionStorage.setItem('dscda_s',t):sessionStorage.removeItem('dscda_s')}catch(e){}};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>n===''||n==null||isNaN(n)?'—':'₹'+Number(n).toLocaleString('en-IN',{maximumFractionDigits:2});
function call(fn,...a){return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args:a,token:sess})})
 .then(r=>r.json()).catch(()=>{throw new Error('Connection problem. Check your network and try again.')})
 .then(r=>{if(r.auth){setSess('');login('Your session expired. Sign in again; your form is kept.')}if(r.ok===false)throw new Error(r.error);return r});}
let B,files=[],token,km='';
const newToken=()=>(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2,12));
const fillSel=(el,arr,ph)=>{el.innerHTML=(ph?`<option value="">${ph}</option>`:'')+arr.map(x=>`<option>${esc(x)}</option>`).join('')};
const show=(el,on)=>el.classList.toggle('hide',!on);
const msg=(el,t,c)=>{el.innerHTML=t?`<div class="msg ${c}" role="alert">${esc(t)}</div>`:''};

function login(n){show($('#login'),1);$('#ln').textContent=n||'';if(!$('#lname').options.length)call('loginNames').then(r=>fillSel($('#lname'),r.names,'Select your name')).catch(e=>$('#ln').textContent=e.message)}
$('#login').onsubmit=e=>{e.preventDefault();const b=$('#lgo');b.disabled=true;$('#ln').textContent='';
 call('login',$('#lname').value,$('#lpin').value).then(r=>{setSess(r.token);$('#lpin').value='';show($('#login'),0);show($('#err'),0);B?0:start()})
 .catch(x=>$('#ln').textContent=x.message).finally(()=>b.disabled=false)};
function start(){call('boot').then(r=>{B=r;init()}).catch(e=>{if(!sess)return;const x=$('#err');show(x,1);x.innerHTML=`<h2>Access needed</h2><p>${esc(e.message)}</p>`;login()})}
sess?start():login();
function init(){
 const u=B.user,c=B.cfg;show($('#app'),1);$('#me').innerHTML=`${esc(u.name)}<br><span class="mut">${esc(u.role)} · <a href="#" id="so">Sign out</a></span>`;$('#so').onclick=e=>{e.preventDefault();setSess('');location.reload()};
 setInterval(()=>{if(document.hidden)return;const t=document.querySelector('.tabs .on').dataset.t;if((t==='mine'||t==='rev')&&$('#det').classList.contains('hide'))load(t)},300000);
 fillSel($('#person'),c.people,'Select person');fillSel($('#dept'),c.depts,'Select department');fillSel($('#nature'),c.natures,'Select nature');
 if(u.role==='EMPLOYEE'){fillSel($('#person'),[u.person]);$('#person').disabled=true;$('#person').insertAdjacentHTML('afterend','<div class="lock">Set by your login</div>');if(!u.person)msg($('#fm'),'Your login has no person name set. Ask the administrator to fill the Person column on the Users tab.','e')}
 $('#modes').innerHTML=c.modes.map(m=>`<label><input type="checkbox" value="${esc(m)}"> ${esc(m)}</label>`).join('');
 $('#date').value=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'});$('#date').max=$('#date').value;
 $('#startTxt').textContent=c.office;token=newToken();
 if(u.role!=='EMPLOYEE')show($('#tRev'),1);
 $('#mineH').textContent=u.role==='EMPLOYEE'?'My vouchers':'All vouchers';
 $$('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
 $('#nature').onchange=sync;$('#modes').onchange=sync;
 $$('[name=dm]').forEach(r=>r.onchange=destMode);$('#dest').oninput=()=>{destPick=null;rt=null;clearTimeout(tm2);clearTimeout(tm3);show($('#sg'),0);const v=$('#dest').value.trim();
  if(v.length>=3)tm2=setTimeout(()=>suggest(v),MAPS_KEY?250:700);tm3=setTimeout(calc,2500)};
 $('#dest').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();clearTimeout(tm3);show($('#sg'),0);calc()}};
 $('#dest').onblur=()=>setTimeout(()=>{show($('#sg'),0);if(!rt&&!$('#dest').readOnly&&$('#dest').value.trim().length>=4){clearTimeout(tm3);calc()}},200);
 $('#trip').onchange=()=>charges();$('#date').onchange=()=>charges();
 $('#manualKm').oninput=()=>charges();
 $('#file').onchange=e=>{files.push(...e.target.files);e.target.value='';drawFiles()};$('#amount').oninput=()=>drawFiles();
 $('#f').onsubmit=submit;bar('mine',false);bar('rev',true);
 if(u.role==='MD'){show($('#tNew'),0);tab('rev')}   // the MD only reviews
}
function tab(t){$$('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));['new','mine','rev'].forEach(s=>show($('#'+s),s===t));show($('#det'),0);
 if(t==='mine'||t==='rev')load(t)}
const reload=()=>{const t=document.querySelector('.tabs .on').dataset.t;if(t==='mine'||t==='rev')load(t)};
const modes=()=>$$('#modes input:checked').map(i=>i.value);
const ROUTE=['Conveyance','PORTER','COURIER','POSTAGE'];let rt=null,destGps='',destPick=null,seq=0,tm2,tm3,sgSeq=0,PL=null,plTok=null;
const destVal=()=>document.querySelector('[name=dm]:checked').value==='gps'?destGps:(destPick?destPick.coords:$('#dest').value.trim());
function sync(){const n=$('#nature').value,conv=n==='Conveyance',m=modes(),r=ROUTE.includes(n);
 show($('#modesBox'),conv);show($('#route'),r);show($('#billn'),conv&&(m.includes('Metro')||m.includes('Cab')));show($('#rs'),!files.length);
 if(!r){rt=null;destGps=''}charges()}
function destMode(){const g=document.querySelector('[name=dm]:checked').value==='gps',d=$('#dest'),n=$('#gpsn');rt=null;destGps='';destPick=null;show($('#sg'),0);seq++;d.value='';d.readOnly=g;show(n,g);show($('#mkm'),0);
 if(!g){charges();d.focus();return}
 n.textContent='Getting your location…';
 if(!navigator.geolocation){n.textContent='This browser cannot share location. Choose "Enter manually".';return}
 navigator.geolocation.getCurrentPosition(p=>{destGps=p.coords.latitude.toFixed(6)+','+p.coords.longitude.toFixed(6);d.value='Current location ('+destGps+')';
  n.textContent='Location captured. It sets the destination only; it is not proof of the journey.';calc()},
 ()=>{n.textContent='Location unavailable or blocked. Choose "Enter manually" instead.'},{timeout:15000,enableHighAccuracy:true})}
window.mapsReady=()=>google.maps.importLibrary('places').then(l=>{PL=l}).catch(()=>{PL=null});window.gm_authFailure=()=>{PL=null};
if(MAPS_KEY){const sc=document.createElement('script');sc.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(MAPS_KEY)+'&loading=async&v=weekly&callback=mapsReady';sc.async=true;document.head.appendChild(sc)}
async function suggest(v){const my=++sgSeq;let items=[];
 try{if(PL){plTok=plTok||new PL.AutocompleteSessionToken();
   const {suggestions}=await PL.AutocompleteSuggestion.fetchAutocompleteSuggestions({input:v,sessionToken:plTok,includedRegionCodes:['in'],locationBias:{center:{lat:28.6139,lng:77.209},radius:50000}});
   items=suggestions.slice(0,5).map(x=>({label:x.placePrediction.text.text,pp:x.placePrediction}))}}
 catch(e){PL=null;items=[]}
 if(!PL&&!items.length){try{items=(await call('suggestPlaces',v)).items}catch(e){items=[]}}
 if(my!==sgSeq)return;const b=$('#sg');
 if(!items.length||destPick){show(b,0);return}
 b.innerHTML=items.map((x,i)=>`<div role="option" data-i="${i}">${esc(x.label)}</div>`).join('');show(b,1);
 b.querySelectorAll('div').forEach(d=>d.onmousedown=e=>{e.preventDefault();pick(items[+d.dataset.i])})}
async function pick(it){const b=$('#sg');show(b,0);clearTimeout(tm3);let coords=it.coords;
 try{if(it.pp){const pl=it.pp.toPlace();await pl.fetchFields({fields:['location']});coords=pl.location.lat().toFixed(6)+','+pl.location.lng().toFixed(6);plTok=null}}catch(e){coords=''}
 if(!coords){$('#dest').value=it.label;destPick=null;calc();return}
 destPick={label:it.label,coords:coords};$('#dest').value=it.label;calc()}
function calc(){const d=destVal(),my=++seq;show($('#mkm'),0);if(d.length<4){rt=null;charges();return}
 const b=$('#chg');show(b,1);b.textContent='Calculating distance…';
 call('calcRoute',d).then(r=>{if(my!==seq)return;rt={km:r.km,label:destPick?destPick.label:r.label};if(destGps)$('#dest').value=r.label;charges()})
 .catch(e=>{if(my!==seq)return;rt=null;show($('#mkm'),1);charges(e.message)})}
function charges(err){const box=$('#chg'),n=$('#nature').value;if(!ROUTE.includes(n)||!B){show(box,0);return}
 const man=Number($('#manualKm').value),one=rt?rt.km:(man>0?man:0);
 if(!one){if(err){show(box,1);box.innerHTML=`<span style="color:var(--err)">${esc(err)}</span>`}else show(box,0);return}
 const mult=Number($('#trip').value),tot=Math.round(one*mult*100)/100,m=modes(),conv=n==='Conveyance',L=[];
 const use=a=>` <button type="button" class="btn sec" style="padding:6px 12px;font-size:13px" data-use="${a}">Use as amount</button>`;
 ['Own Motorcycle','Own car'].filter(x=>conv&&m.includes(x)).forEach(x=>{const a=Math.round(tot*B.cfg.rate*100)/100;
  L.push(`<div style="margin-top:8px"><b>${x}</b>: ${tot} km × ₹${B.cfg.rate} = <b>${inr(a)}</b>${use(a)}</div>`)});
 if(conv&&m.includes('Metro')){const s=B.cfg.metro.find(x=>one<=x[0]),f=metroDay($('#date').value)?s[2]:s[1],a=f*mult;
  L.push(`<div style="margin-top:8px"><b>Metro</b> (indicative): ₹${f} × ${mult} trip${mult>1?'s':''} = <b>${inr(a)}</b>${use(a)}<br><span class="mut">Based on road distance; the real fare depends on the stations. The checker verifies it against your ticket.</span></div>`)}
 if(conv&&(m.includes('Cab')||m.includes('Auto')))L.push('<div style="margin-top:8px"><b>Cab / Auto</b>: no fixed rate. Enter the fare from your bill.</div>');
 if(!conv)L.push('<div style="margin-top:8px">Charges: enter the amount as per your bill.</div>');
 else if(!m.length)L.push('<div style="margin-top:8px">Select a type of conveyance to see charges.</div>');
 box.innerHTML=`<b>${one} km</b> one way${mult>1?` × 2 = <b>${tot} km</b> round trip`:''} <span class="mut">· ${rt?esc(rt.label):'manual entry (flagged for review)'}</span>`+L.join('');show(box,1);
 box.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{$('#amount').value=b.dataset.use})}
const scannable=f=>f.size<=B.cfg.maxBytes&&B.cfg.types.includes(f.type);
const useBtn=a=>` <button type="button" class="btn sec" style="padding:4px 10px;font-size:13px" data-amt="${a}">Use</button>`;
function drawFiles(){const t=files.reduce((a,f)=>a+f.size,0);
 $('#fl').innerHTML=files.map((f,i)=>{const s=f.scan;let st='';
  if(s)st=s.s==='wait'?'Reading receipt…':s.s==='OK'?(s.amount!=null?`Receipt shows <b>${inr(s.amount)}</b> (${esc(s.level)})${s.c&&s.c.length>1?' · also saw '+s.c.filter(x=>x!==s.amount).map(inr).join(', '):''}${useBtn(s.amount)}`:'No amount found. Enter it manually.'):s.why==='SERVICE_OFF'?'Automatic reading is not switched on yet (administrator: add the Drive API service in Apps Script). Enter the amount manually.':s.why==='ERROR'?'Could not read this file. Enter the amount manually.'+(s.err?` <br>Admin detail: ${esc(s.err)}`:''):'Automatic reading unavailable. Enter the amount manually.';
  return `<div><span>${esc(f.name)} (${(f.size/1048576).toFixed(2)} MB)${st?`<br><small class="mut">${st}</small>`:''}</span><button type="button" data-i="${i}" aria-label="Remove ${esc(f.name)}">Remove</button></div>`}).join('')+(t>B.cfg.maxBytes?'<div class="msg e">Total is over 10 MB. Remove a file.</div>':'');
 $$('#fl button[data-i]').forEach(b=>b.onclick=()=>{files.splice(+b.dataset.i,1);drawFiles()});
 const ok=files.filter(f=>f.scan&&f.scan.s==='OK'&&f.scan.amount!=null),sum=Math.round(ok.reduce((a,f)=>a+f.scan.amount,0)*100)/100,box=$('#ocr'),cl=Number($('#amount').value);
 if(!ok.length)show(box,0);else{show(box,1);
  box.innerHTML=`Receipts read: <b>${inr(sum)}</b> in total. Automatic reading can be wrong, so check it against the bill.${ok.length>1?useBtn(sum):''}${verdict(cl,sum)}`}
 $$('#fl button[data-amt],#ocr button[data-amt]').forEach(b=>b.onclick=()=>{$('#amount').value=b.dataset.amt;drawFiles()});
 sync();scanAll()}
function verdict(cl,sum){if(!(cl>0)||files.some(f=>!f.scan||f.scan.s==='wait'))return'';
 const m=modes(),own=$('#nature').value==='Conveyance'&&(m.includes('Own Motorcycle')||m.includes('Own car'));
 const all=files.every(f=>f.scan.s==='OK'&&f.scan.amount!=null&&f.scan.level==='likely');
 if(own)return'<div class="fl">Own vehicle claims are always checked.</div>';
 if(!all)return'<div class="fl">This voucher will need to be checked: not every receipt was read with confidence.</div>';
 if(cl>sum+0.005)return`<div class="fl">Your claim ${inr(cl)} is more than the receipt total ${inr(sum)}. This voucher will need to be checked.</div>`;
 return'<div class="msg s" style="margin:8px 0 0">Your claim is within the receipt total, so this voucher will be approved automatically.</div>'}
let scanning=false;
async function scanAll(){if(scanning)return;scanning=true;
 try{for(const f of files){if(f.scan||!scannable(f))continue;f.scan={s:'wait'};drawFiles();
  try{const r=await call('scanReceipt',{name:f.name,mime:f.type,data:await b64(f)});f.scan={s:r.status,why:r.why,err:r.err,amount:r.amount,level:r.level,c:r.cands}}catch(e){f.scan={s:'ERR'}}drawFiles()}}
 finally{scanning=false}
 if(files.some(f=>!f.scan&&scannable(f)))scanAll()}
const b64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(f)});

async function submit(e){e.preventDefault();const fm=$('#fm'),m=modes(),n=$('#nature').value,v=id=>$('#'+id).value.trim();msg(fm,'');
 const bad=t=>{msg(fm,t,'e');fm.scrollIntoView({behavior:'smooth'})};
 if(!v('person')||!v('dept')||!v('date')||!n)return bad('Complete person, department, date and nature of voucher.');
 if(!(Number(v('amount'))>0))return bad('Enter an amount greater than 0.');
 if(n==='Conveyance'&&!m.length)return bad('Select at least one type of conveyance.');
 if(n==='Conveyance'&&(m.includes('Metro')||m.includes('Cab'))&&!files.length)return bad('A bill is required for Metro or Cab.');
 if(!files.length&&!v('reason'))return bad('Explain why there is no receipt.');
 if(files.reduce((a,f)=>a+f.size,0)>B.cfg.maxBytes)return bad('Total upload size must be under 10 MB.');
 if(files.some(f=>!B.cfg.types.includes(f.type)))return bad('Only PDF, JPG and PNG files are allowed.');
 if((m.includes('Own Motorcycle')||m.includes('Own car'))&&(!destVal()||(!rt&&!(Number(v('manualKm'))>0))))return bad('Own motorcycle / own car needs a destination with a calculated distance. Wait for the distance to appear or enter it manually.');
 const btn=$('#go');btn.disabled=true;btn.textContent=files.length?'Uploading files and saving…':'Saving…';
 try{const fl=await Promise.all(files.map(async f=>({name:f.name,mime:f.type,data:await b64(f)})));
  const r=await call('submitVoucher',{token,person:v('person'),dept:v('dept'),date:v('date'),nature:n,modes:n==='Conveyance'?m:[],
   dest:ROUTE.includes(n)?destVal():'',destLabel:destPick?destPick.label:'',trip:$('#trip').value,manualKm:v('manualKm'),amount:v('amount'),remarks:v('remarks'),reason:v('reason'),files:fl});
  msg(fm,`Voucher submitted. ID: ${r.voucherId}. `+(r.outcome==='AUTO_APPROVED'?'Status: Approved (your claim is within the receipt total). It now goes to Accounts for payment.':'This voucher needs to be checked by Accounts. '+(r.note||'')),r.outcome==='AUTO_APPROVED'?'s':'w');$('#f').reset();files=[];km='';token=newToken();
  $('#date').value=$('#date').max;rt=null;destGps='';destPick=null;$('#dest').readOnly=false;show($('#gpsn'),0);drawFiles();fm.scrollIntoView({behavior:'smooth'})
 }catch(x){bad(x.message+' Nothing was submitted twice; you can press Submit again.')}
 finally{btn.disabled=false;btn.textContent='Submit voucher'}}

const rowH=v=>`<div class="row" data-id="${esc(v.id)}" tabindex="0"><div><b>${esc(v.id)}</b>${esc(v.person)} · ${esc(v.nature)} · ${esc(v.date)}<br><span class="mut">${esc(v.desc).slice(0,70)}</span></div><div style="text-align:right"><b>${inr(v.amount)}</b><span class="pill ${esc(v.status)}">${esc(v.status)}</span>${v.auto?'<br><small class="mut">auto-approved</small>':v.status==='SUBMITTED'?'<br><small class="mut">needs checking</small>':''}</div></div>`;
function list(el,items,empty){el.innerHTML=items.length?items.map(rowH).join(''):`<p class="mut">${empty}</p>`;
 $$('#'+el.id+' .row').forEach(r=>{r.onclick=()=>open(r.dataset.id);r.onkeydown=e=>{if(e.key==='Enter')open(r.dataset.id)}})}
const STS=['SUBMITTED','VERIFIED','APPROVED','RETURNED','REJECTED','COMPLETED'];let tmr;
function bar(id,pending){const nm=B.user.role!=='EMPLOYEE',el=$('#fb_'+id);
 el.innerHTML=(nm?`<div><label for="${id}n">Name</label><select id="${id}n"><option value="">All names</option></select></div>`:'')+
 `<div><label for="${id}f">Voucher date from</label><input type="date" id="${id}f"></div><div><label for="${id}t">Voucher date to</label><input type="date" id="${id}t"></div>
 <div><label for="${id}s">Status</label><select id="${id}s">${pending?'<option value="PENDING">Needs my action</option>':''}<option value="ALL">All</option>${STS.map(x=>`<option>${x}</option>`).join('')}</select></div>
 <div><label for="${id}q">Search</label><input id="${id}q" placeholder="Voucher ID"></div>`;
 el.querySelectorAll('select,input').forEach(x=>x.oninput=()=>{clearTimeout(tmr);tmr=setTimeout(()=>load(id),x.id.endsWith('q')?350:60)})}
function load(id){const el=$('#'+id+'L'),g=k=>($('#'+id+k)||{}).value||'',rv=id==='rev',staff=B.user.role!=='EMPLOYEE';
 el.innerHTML='<p class="mut">Loading…</p>';
 call('listVouchers',{scope:rv?'review':staff?'all':'mine',status:g('s'),name:g('n'),from:g('f'),to:g('t'),text:g('q')}).then(r=>{
  const s=$('#'+id+'n');if(s){const cur=s.value;s.innerHTML='<option value="">All names</option>'+(r.names||[]).map(n=>`<option>${esc(n)}</option>`).join('');s.value=cur}
  if(rv)$('#sum').innerHTML=Object.keys(r.summary.counts).map(k=>`<span>${esc(k)}: <b>${r.summary.counts[k]}</b></span>`).join('')+`<span>No receipt: <b>${r.summary.missing}</b></span>`;
  list(el,r.items,'Nothing matches these filters.');if(r.more)el.insertAdjacentHTML('beforeend','<p class="mut">Showing the latest 150. Narrow the name or dates to see others.</p>')})
 .catch(e=>el.innerHTML=`<div class="msg e">${esc(e.message)}</div>`)}

const metroDay=d=>new Date(d+'T00:00:00Z').getUTCDay()===0||B.cfg.holidays.includes(d);
function open(id){const d=$('#det');show(d,1);d.innerHTML='<p class="mut">Loading…</p>';d.scrollIntoView({behavior:'smooth'});
 call('getVoucher',id).then(r=>{const v=r.v,st=v.status,own=/Own Motorcycle|Own car/.test(v.modes),metro=/Metro/.test(v.modes);
  const lbl={SUBMITTED:'Verify',VERIFIED:'Approve',APPROVED:'Mark paid'}[st];
  d.innerHTML=`<h2>${esc(v.id)} <span class="pill ${esc(st)}">${esc(st)}</span></h2><div id="dm"></div><dl>
  <dt>Person</dt><dd>${esc(v.person)} · ${esc(v.dept)}</dd><dt>Date</dt><dd>${esc(v.date)} (submitted ${esc(v.ts)})</dd><dt>Nature</dt><dd>${esc(v.nature)} ${esc(v.modes)}</dd>
  <dt>Claimed</dt><dd>${inr(v.amount)}</dd>${v.verified!==''?`<dt>Verified</dt><dd>${inr(v.verified)}</dd>`:''}
  ${v.start||v.dest?`<dt>Route</dt><dd>${esc(v.start)} → ${esc(v.dest)}</dd>`:''}
  ${v.km!==''?`<dt>Distance</dt><dd>${esc(v.km)} km ${esc(String(v.trip).toLowerCase())} (${esc(v.kmSrc)})${v.eligible!==''?` × ₹${B.cfg.rate} = ${inr(v.eligible)} suggested`:''}</dd>`:''}
  <dt>Remarks</dt><dd>${esc(v.desc)||'—'}</dd>${v.ocr!==''?`<dt>Receipt reads</dt><dd>${inr(v.ocr)} (automatic, unverified)<br><span class="mut">${esc(v.ocrDetail)}</span></dd>`:''}<dt>Receipts</dt><dd>${v.link?`<a href="${esc(v.link)}" target="_blank" rel="noopener">Open folder</a> (needs Drive access)`:'None on file'}</dd>
  ${v.checkerBy?`<dt>Checked by</dt><dd>${esc(v.checkerBy)} ${esc(v.checkerNote)}</dd>`:''}${v.mdBy?`<dt>MD</dt><dd>${esc(v.mdBy)} ${esc(v.mdNote)}</dd>`:''}</dl>
  ${metro?`<div class="box"><label class="lb" for="mk">Metro fare check: trip distance (km) from the DMRC fare calculator</label><input type="number" id="mk" step="0.1" min="0" style="max-width:160px" value="${v.km!==''?(v.trip==='ROUND TRIP'?v.km/2:v.km):''}"> <span id="mf"></span><div class="mut">Reference for one trip on ${esc(v.date)} (${metroDay(v.date)?'Sunday/holiday':'Mon–Sat'} fares). Compare with the tickets; it does not change any amount.</div></div>`:''}
  ${v.auto?`<div class="msg s" style="margin-top:10px">Approved automatically: ${esc(v.autoNote)}</div>`:''}
  ${v.flags.map(f=>`<div class="fl">⚠ ${esc(f)}</div>`).join('')}
  ${v.canAct?`<div style="margin-top:14px">${st==='SUBMITTED'?`<div class="g2"><div class="f"><label for="ver">Verified amount (₹)</label><input type="number" id="ver" step="0.01" value="${esc(v.amount)}"></div>
  ${own?`<div class="f"><label for="rkm">Confirmed distance (km)</label><input type="number" id="rkm" step="0.1" value="${esc(v.km)}"></div>`:''}</div>`:''}
  <label class="lb" for="cm">${st==='APPROVED'?'Payment reference':'Comment'} (required to return or reject; also if you change amount or distance)</label><textarea id="cm"></textarea>
  <div class="acts"><button class="btn" data-a="advance">${lbl}</button>${st!=='APPROVED'?'<button class="btn bad" data-a="return">Return</button><button class="btn bad" data-a="reject">Reject</button>':''}</div></div>`:''}
  <h3 style="margin-top:16px">History</h3>${r.hist.map(h=>`<p class="mut">${esc(h.t)} · ${esc(h.by)} · ${esc(h.action)} → ${esc(h.to)} ${esc(h.note)}</p>`).join('')||'<p class="mut">No history yet.</p>'}
  <button class="btn sec" style="margin-top:12px" id="cl">Close</button>`;
  $('#cl').onclick=()=>show(d,0);
  if($('#mk'))$('#mk').oninput=()=>{const k=Number($('#mk').value);const s=B.cfg.metro.find(x=>k<=x[0]);$('#mf').innerHTML=k>0&&s?`Fare slab: <b>${inr(metroDay(v.date)?s[2]:s[1])}</b> per trip`:''};if($('#mk'))$('#mk').oninput();
  $$('#det [data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a;
   if(a!=='advance'&&!confirm(`${a==='reject'?'Reject':'Return'} ${v.id}? This is recorded in the audit history.`))return;
   if(a==='advance'&&st==='APPROVED'&&!confirm('Mark as paid? Only do this once payment has been made.'))return;
   $$('#det button').forEach(x=>x.disabled=true);
   call('actOnVoucher',{id:v.id,action:a,comment:$('#cm').value,verified:$('#ver')?$('#ver').value:'',km:$('#rkm')&&$('#rkm').value!==String(v.km)?$('#rkm').value:''})
    .then(()=>{show(d,0);reload()}).catch(e=>{msg($('#dm'),e.message,'e');$$('#det button').forEach(x=>x.disabled=false)})})
 }).catch(e=>d.innerHTML=`<div class="msg e">${esc(e.message)}</div>`)}
</script></body></html>
